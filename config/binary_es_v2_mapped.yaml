num_sim_steps: 1000
snn_params:
  input_size: 5
  hidden_size: 0
  output_size: 2
  dt: 0.001
  neuron_params:
    tau_mem: 0.004
    tau_trace: 0.004
  synapse_params:
    clip_weights: false
    normalise_weights: true
    normalise_method: L2
  winner_take_all: true
spikegen_params:
  class: BinaryArrayGenerator
  starting_class: ascending
  interval: 2
  spacing: 10
  p: 1.0
rewarder_params:
  type: simple
  # type: weighted
  # ignore_silent_inputs: true
  # log_scale: true
collector_params:
  # type: simple
  # fitness_type: reward
  # agg_func: sum
  fitness_type: mapped
  map_func: func3
  map_func_kwargs:
    a: 3
    b: 2
arule_params:
  learning_rate: 0.1
  hidden_size: 4
  bias: true
  hidden_activation: relu
  output_activation: tanh
  use_weights: true
  use_reward: true
  use_trace_pre: true
  use_trace_post: true
evo_params:
  manager:
    type: original
    # type: evosax
    max_generations: 100
    # target_fitness: 1.0
    tolerance: 0.02
    num_trials: 15
    save_best: 3
  solver:
    # ndim: 25
    type: CMA-ES
    popsize: 30
    # minimise: false
