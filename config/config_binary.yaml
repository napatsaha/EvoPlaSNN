num_sim_steps: 1000
pattern_params:
  type: binary
  interval: 3
spikegen_params:
  class: CustomTimingGenerator
  binary: false
  spacing: 10
  jitter_std: 0.5
  failure_rate: 0.05
  randomise_class: False
snn_params:
  input_size: 5
  hidden_size: 0
  output_size: 2
  dt: 0.001
  neuron_params:
    tau_mem: 0.006
    tau_trace: 0.006
    trace_type: dx3
  synapse_params:
    clip_weights: false
    normalise_weights: true
    normalise_method: L2
    eligibility_trace: false
    tau_syn: 0.015
  winner_take_all: true
rewarder_params:
  type: weighted
  target_position: last
  ignore_silent_inputs: false
  log_scale: false
collector_params:
  type: simple
  fitness_type: reward
  agg_func: sum
arule_params:
  learning_rate: 0.1
  hidden_size: 4
  bias: true
  hidden_activation: relu
  output_activation: tanh
  use_weights: true
  use_reward: true
  use_trace_pre: true
  use_trace_post: true
  use_eligibility: false
evo_params:
  manager:
    type: original
    max_generations: 100
    tolerance: 0.02
    num_trials: 10
    save_best: 5
    target_fitness: None
    record_classes: false
  solver:
    # ndim: 25
    type: CMA-ES
    popsize: 30
    # minimise: false
  evaluator:
    update_inputs: false
